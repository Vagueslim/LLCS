<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">LCCS placeholder map</title>
  <desc id="desc">Dark command map placeholder with cyan route lines and amber incident nodes.</desc>
  <defs>
    <linearGradient id="sea" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#06131d"/>
      <stop offset="100%" stop-color="#0b2631"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="url(#sea)"/>
  <g opacity=".22" stroke="#65d8f2" stroke-width="1">
    <path d="M0 130H1200M0 250H1200M0 370H1200M0 490H1200M0 610H1200"/>
    <path d="M120 0V720M260 0V720M400 0V720M540 0V720M680 0V720M820 0V720M960 0V720M1100 0V720"/>
  </g>
  <path d="M200 560c80-70 80-170 170-210 100-45 110-160 230-180 110-18 170 48 260-8 60-38 120-72 190-58"
        fill="none" stroke="#11c7e9" stroke-width="5" stroke-dasharray="14 16" filter="url(#glow)"/>
  <path d="M226 522c90-28 156-40 240-22 110 24 170-8 240-66 68-58 160-75 254-62"
        fill="none" stroke="#f0b84a" stroke-width="4" filter="url(#glow)"/>
  <g filter="url(#glow)">
    <circle cx="200" cy="560" r="14" fill="#091722" stroke="#7ee7ff" stroke-width="4"/>
    <circle cx="390" cy="345" r="14" fill="#091722" stroke="#f0b84a" stroke-width="4"/>
    <circle cx="600" cy="170" r="18" fill="#091722" stroke="#ff675f" stroke-width="5"/>
    <circle cx="860" cy="160" r="14" fill="#091722" stroke="#69e29a" stroke-width="4"/>
    <circle cx="1050" cy="104" r="14" fill="#091722" stroke="#7ee7ff" stroke-width="4"/>
  </g>
  <g fill="#b8ccd6" opacity=".75" font-family="Arial, sans-serif" font-size="24">
    <text x="54" y="80">LCCS MAP PLACEHOLDER</text>
    <text x="54" y="112" font-size="16">Replace with live GIS layer when available</text>
  </g>
</svg>
